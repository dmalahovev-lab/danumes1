<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danumes Messenger</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-glass">

    <!-- Форма входа / Регистрации -->
    <div id="authScreen" class="auth-container">
        <div class="auth-card">
            <h2 id="authTitle">Вход в Danumes</h2>
            <input type="text" id="authUsername" placeholder="Логин">
            <input type="password" id="authPassword" placeholder="Пароль">
            <button id="authBtn">Войти</button>
            <p id="toggleAuth">Нет аккаунта? Зарегистрироваться</p>
        </div>
    </div>

    <!-- Главный экран мессенджера -->
    <div id="appScreen" class="messenger-container" style="display: none;">
        
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="profile-section">
                <div class="avatar" id="myAvatar">U</div>
                <div class="user-info">
                    <h3 id="myUsername">User</h3>
                    <span class="status">в сети</span>
                </div>
                <!-- Шестеренка настроек -->
                <svg id="openSettings" class="settings-toggle-btn" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
            
            <div class="search-bar">
                <input type="text" id="userSearchInput" placeholder="Найти человека по логину...">
                <div id="searchResults" class="search-results-box"></div>
            </div>

            <div class="chats-list" id="chatsList">
                <!-- Сюда добавляются активные чаты -->
            </div>
        </aside>

        <!-- Окно чата -->
        <main class="chat-window">
            <header class="chat-header" id="chatHeader" style="cursor: pointer;">
                <div class="chat-header-info">
                    <h4 id="activeChatName">Выберите, кому написать</h4>
                    <span id="activeChatStatus"></span>
                </div>
            </header>

            <!-- Контейнер сообщений -->
            <div class="messages-container" id="messagesContainer">
                <div class="placeholder-text">Выберите чат или найдите пользователя через поиск, чтобы начать общение.</div>
            </div>

            <!-- Информационная плашка для Ответа / Редактирования (Новое!) -->
            <div id="actionPreviewArea" class="action-preview-container" style="display: none;">
                <div class="action-preview-border"></div>
                <div class="action-preview-content">
                    <h5 id="actionPreviewTitle">Ответ на сообщение</h5>
                    <p id="actionPreviewText">Текст сообщения...</p>
                </div>
                <button id="cancelActionBtn" class="cancel-action-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <!-- Зона ввода текста -->
            <footer class="chat-input-area">
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                
                <button class="attach-btn" id="attachBtn" disabled title="Отправить картинку">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                
                <input type="text" id="messageInput" placeholder="Напишите сообщение..." disabled>
                
                <button class="send-btn" id="sendBtn" disabled title="Отправить">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </footer>
        </main>

        <!-- Настройки тем (Модальное окно) -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <h3>Настройки тем Danumes</h3>
                <div class="theme-options">
                    <button class="theme-btn btn-glass" onclick="setTheme('glass')">Liquid Glass (Темная)</button>
                    <button class="theme-btn btn-light" onclick="setTheme('light')">Светлое стекло</button>
                    <button class="theme-btn btn-neon" onclick="setTheme('neon')">Neon Cyberpunk</button>
                </div>
                <button id="closeSettings" class="close-modal-btn">Закрыть</button>
            </div>
        </div>

        <!-- Профиль собеседника (Модальное окно) -->
        <div id="profileModal" class="modal">
            <div class="modal-content">
                <div class="avatar" id="profileModalAvatar" style="width: 70px; height: 70px; font-size: 28px; margin: 0 auto 15px auto;">U</div>
                <h3 id="profileModalUsername" style="font-size: 20px; margin-bottom: 5px;">Username</h3>
                <p style="color: #00ffb7; font-size: 14px; margin-bottom: 20px;">Пользователь мессенджера Danumes</p>
                <button id="closeProfile" class="close-modal-btn">Закрыть</button>
            </div>
        </div>

    </div>

    <script src="client.js"></script>
</body>
</html>
